<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Exercise 8 - Form Controls</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .form-wrapper {
            max-width: 500px;
            margin: 40px auto;
            border: 1px solid #ddd;
            background-color: #fff;
            padding-bottom: 25px;
        }
        .custom-alert {
            border-radius: 0;
            background-color: #fef3c7; 
            border: none; 
            border-bottom: 1px solid #fde68a;
            padding: 1rem 1rem;
            margin-bottom: 20px;
        }
        .form-help-text {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 0.25rem;
        }
        .form-label {
            color: #555;
            margin-bottom: 0.25rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-wrapper shadow-sm">
            
            <!-- Alert top -->
            <div class="alert alert-warning alert-dismissible fade show custom-alert" role="alert">
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Form Content -->
            <div class="px-4">
                <h1 class="mb-4 text-dark" style="font-weight: 500;">Form đặt vé máy bay</h1>
                
                <form>
                    <!-- Họ tên (Input Group) -->
                    <div class="mb-3">
                        <label class="form-label">Họ tên</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="far fa-user text-secondary"></i></span>
                            <input type="text" class="form-control" placeholder="Họ tên">
                            <span class="input-group-text bg-light text-secondary">vnđ</span>
                        </div>
                        <div class="form-help-text">Phải nhập 5 ký tự, in hoa....</div>
                    </div>

                    <!-- Địa chỉ -->
                    <div class="mb-3">
                        <label class="form-label">Địa chỉ</label>
                        <input type="text" class="form-control">
                        <div class="form-help-text">Phải nhập 5 ký tự, in hoa....</div>
                    </div>

                    <!-- Row: Đi từ & Đến -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Đi từ</label>
                            <select class="form-select text-secondary">
                                <option selected>Hà nội</option>
                                <option value="1">Hồ Chí Minh</option>
                                <option value="2">Đà Nẵng</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Đến</label>
                            <select class="form-select text-secondary">
                                <option selected>Hà nội</option>
                                <option value="1">Hồ Chí Minh</option>
                                <option value="2">Đà Nẵng</option>
                            </select>
                        </div>
                    </div>

                    <!-- Checkboxes -->
                    <div class="mb-4">
                        <label class="form-label">Chọn chiều đi (Khứ hồi)</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="checkDi">
                            <label class="form-check-label text-secondary" for="checkDi">Đi</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="checkVe">
                            <label class="form-check-label text-secondary" for="checkVe">Về</label>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100 py-2 fs-5">Đặt vé</button>
                </form>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
