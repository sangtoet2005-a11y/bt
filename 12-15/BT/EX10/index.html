<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 10 - React Bootstrap Demo</title>
    
    <!-- 1. Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- 2. React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- 3. React-Bootstrap -->
    <script src="https://unpkg.com/react-bootstrap@next/dist/react-bootstrap.min.js" crossorigin></script>
    
    <!-- 4. Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #f4f6f9; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
        .main-content { flex: 1; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Lấy các components từ thư viện ReactBootstrap đã được nhúng qua CDN
        const { Container, Navbar, Nav, Row, Col, Card, Button } = ReactBootstrap;

        const App = () => {
            return (
                <div className="d-flex flex-column min-vh-100">
                    {/* Component Navbar của React-Bootstrap */}
                    <Navbar bg="warning" expand="lg" className="shadow-sm pb-3 pt-3">
                        <Container>
                            <Navbar.Brand href="#home" className="fw-bold text-danger fs-3">
                                FPT UNIVERSITY
                            </Navbar.Brand>
                            <Navbar.Toggle aria-controls="basic-navbar-nav" />
                            <Navbar.Collapse id="basic-navbar-nav">
                                <Nav className="ms-auto">
                                    <Nav.Link href="#home" className="fw-semibold">Home</Nav.Link>
                                    <Nav.Link href="#about" className="fw-semibold">About</Nav.Link>
                                    <Nav.Link href="#contact" className="fw-semibold">Contact</Nav.Link>
                                </Nav>
                            </Navbar.Collapse>
                        </Container>
                    </Navbar>

                    {/* Nội dung chính sử dụng Container, Row, Col */}
                    <main className="main-content py-5">
                        <Container>
                            <div className="text-center mb-5">
                                <h1 className="fw-bold text-secondary">React-Bootstrap Layout</h1>
                                <p className="text-muted">Building the website using pre-built React components.</p>
                            </div>

                            <Row className="g-4">
                                {[1, 2, 3].map((item) => (
                                    <Col md={4} key={item}>
                                        <Card className="h-100 border-0 shadow-sm">
                                            {/* Ảnh giả lập */}
                                            <div style={{height: '200px', backgroundColor: '#e9ecef', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#adb5bd', fontSize: '1.5rem'}}>
                                                Image {item}
                                            </div>
                                            <Card.Body>
                                                <Card.Title>Product {item}</Card.Title>
                                                <Card.Text className="text-muted">
                                                    This is a sample card built with React-Bootstrap. It combines the power of React and Bootstrap.
                                                </Card.Text>
                                                <Button variant="outline-warning" className="w-100 text-dark fw-bold">View Details</Button>
                                            </Card.Body>
                                        </Card>
                                    </Col>
                                ))}
                            </Row>
                        </Container>
                    </main>

                    {/* Footer */}
                    <footer className="bg-dark text-white text-center py-4 mt-auto">
                        <Container>
                            <p className="mb-0">&copy; 2026 React-Bootstrap Website. All rights reserved.</p>
                        </Container>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
