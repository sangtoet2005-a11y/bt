<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Exercise 1 - Let's test the grid</title>
    <!-- Bootstrap CSS from node_modules (as instructed in the course) -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <!-- CDN Link added for quick previewing -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .placeholder-img { height: 250px; background: #e0e0e0; display: flex; align-items: center; justify-content: center; color: #666; font-weight: bold; }
        .placeholder-logo { background-color: #e0e0e0; width: 150px; height: 150px; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: #666; font-size: 24px; font-weight: bold; border-radius: 10px; }
    </style>
</head>
<body>
<div class="container-fluid p-0">
    <div class="bg-light p-5 mb-4">
        <h1 class="display-5 fw-bold">Let's test the grid!</h1>
    </div>
    <div class="container mb-5">
        <div class="row text-center border-top border-start border-end border-dark">
            <div class="col-6 border-end border-dark p-3 bg-light">First col</div>
            <div class="col-6 p-3 bg-light">Second col</div>
        </div>
        <div class="row text-center border-top border-start border-end border-dark">
            <div class="col-4 border-end border-dark p-3 bg-light">col</div>
            <div class="col-4 border-end border-dark p-3 bg-light">col</div>
            <div class="col-4 p-3 bg-light">col</div>
        </div>
        <div class="row text-center border border-dark">
            <div class="col-3 border-end border-dark p-3 bg-light">col</div>
            <div class="col-3 border-end border-dark p-3 bg-light">col</div>
            <div class="col-3 border-end border-dark p-3 bg-light">col</div>
            <div class="col-3 p-3 bg-light">col</div>
        </div>
    </div>
    <div class="text-center py-2" style="background-color: #d8c3c3;">
        <h2 class="m-0 py-2" style="color: #444;">Created by ABC!</h2>
    </div>
</div>
<!-- Scripts required by Bootstrap -->
<script src="node_modules/jquery/dist/jquery.slim.min.js"></script>
<script src="node_modules/popper.js/dist/umd/popper.min.js"></script>
<script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
