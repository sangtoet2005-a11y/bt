<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Exercise 2 - My First Bootstrap Page</title>
    <!-- Bootstrap CSS from node_modules (as instructed in the course) -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <!-- CDN Link added for quick previewing -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .placeholder-img { height: 250px; background: #e0e0e0; display: flex; align-items: center; justify-content: center; color: #666; font-weight: bold; }
        .placeholder-logo { background-color: #e0e0e0; width: 150px; height: 150px; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: #666; font-size: 24px; font-weight: bold; border-radius: 10px; }
    </style>
</head>
<body>
<div class="container-fluid text-center p-0">
    <div class="bg-light p-5 mb-4">
        <h2 class="display-5">My First Bootstrap Page</h2>
    </div>
    <div class="container mb-5">
        <div class="row justify-content-center align-items-center" style="min-height: 200px;">
            <div class="col-md-4 mb-3">
                <div class="placeholder-logo" style="background-color: #e34f26; color: white; font-size: 80px;">5</div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="placeholder-logo" style="background-color: #1572b6; color: white; font-size: 80px;">3</div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="placeholder-logo" style="background-color: #563d7c; color: white; font-size: 80px;">B</div>
            </div>
        </div>
    </div>
</div>
<!-- Scripts required by Bootstrap -->
<script src="node_modules/jquery/dist/jquery.slim.min.js"></script>
<script src="node_modules/popper.js/dist/umd/popper.min.js"></script>
<script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
